# Content editor (Sveltia CMS). Open https://YOUR-SITE/admin/
backend:
  name: github
  repo: anassalem118-dot/rs   # <-- change this
  branch: main
  # Cloudflare Pages only: uncomment and set the address of your auth worker (see README)
  # base_url: https://YOUR-WORKER.workers.dev
media_folder: static/uploads
public_folder: /uploads

collections:
  - name: site
    label: "Site content / محتوى الموقع"
    files:
      - name: site
        label: "All page texts"
        file: content/site.json
        fields:
          - label: "General"
            name: general
            widget: object
            collapsed: true
            fields:
              - { label: "Brand name shown in the header", name: name, widget: string, required: false }
              - { label: "Website address for search engines, e.g. https://example.com (optional)", name: site_url, widget: string, required: false }
              - { label: "Tagline under the headline (English)", name: tagline_en, widget: string, required: false }
              - { label: "Tagline under the headline (Arabic)", name: tagline_ar, widget: string, required: false }
              - { label: "Page title shown on Google (English)", name: meta_title_en, widget: string, required: false }
              - { label: "Page title shown on Google (Arabic)", name: meta_title_ar, widget: string, required: false }
              - { label: "Description shown on Google (English)", name: meta_description_en, widget: text, required: false }
              - { label: "Description shown on Google (Arabic)", name: meta_description_ar, widget: text, required: false }
          - label: "Home: Hero"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "Headline (English)", name: title_en, widget: string, required: false }
              - { label: "Headline (Arabic)", name: title_ar, widget: string, required: false }
              - { label: "Text (English)", name: text_en, widget: text, required: false }
              - { label: "Text (Arabic)", name: text_ar, widget: text, required: false }
              - { label: "Button 1 label (English)", name: cta1_en, widget: string, required: false }
              - { label: "Button 1 label (Arabic)", name: cta1_ar, widget: string, required: false }
              - { label: "Button 1 link", name: cta1_url, widget: string, required: false }
              - { label: "Button 2 label (English)", name: cta2_en, widget: string, required: false }
              - { label: "Button 2 label (Arabic)", name: cta2_ar, widget: string, required: false }
              - { label: "Button 2 link", name: cta2_url, widget: string, required: false }
              - { label: "Background image (optional)", name: image, widget: image, required: false }
              - { label: "Show the response spectrum drawing", name: show_spectrum, widget: boolean, default: true }
          - label: "Home: About and numbers"
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: "Title (English)", name: title_en, widget: string, required: false }
              - { label: "Title (Arabic)", name: title_ar, widget: string, required: false }
              - { label: "Short text (home page) (English)", name: text_en, widget: text, required: false }
              - { label: "Short text (home page) (Arabic)", name: text_ar, widget: text, required: false }
              - { label: "Long text (About page, blank line = new paragraph) (English)", name: body_en, widget: text, required: false }
              - { label: "Long text (About page, blank line = new paragraph) (Arabic)", name: body_ar, widget: text, required: false }
              - label: "Numbers"
                name: stats
                widget: list
                fields:
                  - { label: "Number", name: number, widget: string, required: false }
                  - { label: "Label (English)", name: label_en, widget: string, required: false }
                  - { label: "Label (Arabic)", name: label_ar, widget: string, required: false }
          - label: "Home: Seismic test (3D)"
            name: sim
            widget: object
            collapsed: true
            fields:
              - { label: "Show this section", name: show, widget: boolean, default: true }
              - { label: "Title (English)", name: title_en, widget: string, required: false }
              - { label: "Title (Arabic)", name: title_ar, widget: string, required: false }
              - { label: "Text (English)", name: text_en, widget: text, required: false }
              - { label: "Text (Arabic)", name: text_ar, widget: text, required: false }
              - { label: "Button label (English)", name: button_en, widget: string, required: false }
              - { label: "Button label (Arabic)", name: button_ar, widget: string, required: false }
              - { label: "Slider label (English)", name: label_en, widget: string, required: false }
              - { label: "Slider label (Arabic)", name: label_ar, widget: string, required: false }
              - { label: "Use an image instead of the 3D model (optional)", name: image, widget: image, required: false }
          - label: "Section titles"
            name: titles
            widget: object
            collapsed: true
            fields:
              - { label: "Services title (English)", name: services_en, widget: string, required: false }
              - { label: "Services title (Arabic)", name: services_ar, widget: string, required: false }
              - { label: "Process title (English)", name: process_en, widget: string, required: false }
              - { label: "Process title (Arabic)", name: process_ar, widget: string, required: false }
              - { label: "Projects title (English)", name: projects_en, widget: string, required: false }
              - { label: "Projects title (Arabic)", name: projects_ar, widget: string, required: false }
              - { label: "All projects button (English)", name: projects_all_en, widget: string, required: false }
              - { label: "All projects button (Arabic)", name: projects_all_ar, widget: string, required: false }
              - { label: "Team title (English)", name: team_en, widget: string, required: false }
              - { label: "Team title (Arabic)", name: team_ar, widget: string, required: false }
              - { label: "Clients title (English)", name: clients_en, widget: string, required: false }
              - { label: "Clients title (Arabic)", name: clients_ar, widget: string, required: false }
              - { label: "Clients text (English)", name: clients_text_en, widget: text, required: false }
              - { label: "Clients text (Arabic)", name: clients_text_ar, widget: text, required: false }
              - { label: "Values title (About page) (English)", name: values_en, widget: string, required: false }
              - { label: "Values title (About page) (Arabic)", name: values_ar, widget: string, required: false }
          - label: "Process steps"
            name: process
            widget: list
            fields:
              - { label: "Title (English)", name: title_en, widget: string, required: false }
              - { label: "Title (Arabic)", name: title_ar, widget: string, required: false }
              - { label: "Text (English)", name: text_en, widget: text, required: false }
              - { label: "Text (Arabic)", name: text_ar, widget: text, required: false }
          - label: "About page: Values"
            name: values
            widget: list
            fields:
              - { label: "Title (English)", name: title_en, widget: string, required: false }
              - { label: "Title (Arabic)", name: title_ar, widget: string, required: false }
              - { label: "Text (English)", name: text_en, widget: text, required: false }
              - { label: "Text (Arabic)", name: text_ar, widget: text, required: false }
          - label: "Contact and social"
            name: contact
            widget: object
            collapsed: true
            fields:
              - { label: "Title (English)", name: title_en, widget: string, required: false }
              - { label: "Title (Arabic)", name: title_ar, widget: string, required: false }
              - { label: "Text (English)", name: text_en, widget: text, required: false }
              - { label: "Text (Arabic)", name: text_ar, widget: text, required: false }
              - { label: "Email", name: email, widget: string, required: false }
              - { label: "Phone", name: phone, widget: string, required: false }
              - { label: "Address (English)", name: address_en, widget: string, required: false }
              - { label: "Address (Arabic)", name: address_ar, widget: string, required: false }
              - { label: "WhatsApp number with country code, digits only (shows a chat button)", name: whatsapp, widget: string, required: false }
              - { label: "Google Maps embed link (the src of the iframe)", name: map, widget: string, required: false }
              - { label: "LinkedIn link", name: linkedin, widget: string, required: false }
              - { label: "Instagram link", name: instagram, widget: string, required: false }
              - { label: "Facebook link", name: facebook, widget: string, required: false }
              - { label: "Contact form: external form address (leave empty on Netlify)", name: form_action, widget: string, required: false }
              - { label: "Contact form: access key (Web3Forms only)", name: form_key, widget: string, required: false }
  - name: services
    label: "Services"
    folder: content/services
    format: json
    extension: json
    create: true
    slug: "{{title_en}}"
    identifier_field: title_en
    sortable_fields: [order]
    fields:
      - { label: "Title (English)", name: title_en, widget: string, required: false }
      - { label: "Title (Arabic)", name: title_ar, widget: string, required: false }
      - { label: "Short text (English)", name: excerpt_en, widget: text, required: false }
      - { label: "Short text (Arabic)", name: excerpt_ar, widget: text, required: false }
      - { label: "Page text (blank line = new paragraph) (English)", name: body_en, widget: text, required: false }
      - { label: "Page text (blank line = new paragraph) (Arabic)", name: body_ar, widget: text, required: false }
      - { label: "Order (1 = first)", name: order, widget: number, value_type: int, default: 50, required: false }
  - name: projects
    label: "Projects"
    folder: content/projects
    format: json
    extension: json
    create: true
    slug: "{{title_en}}"
    identifier_field: title_en
    sortable_fields: [order]
    fields:
      - { label: "Title (English)", name: title_en, widget: string, required: false }
      - { label: "Title (Arabic)", name: title_ar, widget: string, required: false }
      - { label: "Type (e.g. Residential tower) (English)", name: type_en, widget: string, required: false }
      - { label: "Type (e.g. Residential tower) (Arabic)", name: type_ar, widget: string, required: false }
      - { label: "Location (English)", name: location_en, widget: string, required: false }
      - { label: "Location (Arabic)", name: location_ar, widget: string, required: false }
      - { label: "Year", name: year, widget: string, required: false }
      - { label: "Main image", name: image, widget: image, required: false }
      - { label: "Short text (English)", name: excerpt_en, widget: text, required: false }
      - { label: "Short text (Arabic)", name: excerpt_ar, widget: text, required: false }
      - { label: "Page text (blank line = new paragraph) (English)", name: body_en, widget: text, required: false }
      - { label: "Page text (blank line = new paragraph) (Arabic)", name: body_ar, widget: text, required: false }
      - { label: "Order (1 = first)", name: order, widget: number, value_type: int, default: 50, required: false }
  - name: team
    label: "Team"
    folder: content/team
    format: json
    extension: json
    create: true
    slug: "{{name_en}}"
    identifier_field: name_en
    sortable_fields: [order]
    fields:
      - { label: "Name (English)", name: name_en, widget: string, required: false }
      - { label: "Name (Arabic)", name: name_ar, widget: string, required: false }
      - { label: "Role (English)", name: role_en, widget: string, required: false }
      - { label: "Role (Arabic)", name: role_ar, widget: string, required: false }
      - { label: "Short bio (English)", name: bio_en, widget: text, required: false }
      - { label: "Short bio (Arabic)", name: bio_ar, widget: text, required: false }
      - { label: "Photo", name: photo, widget: image, required: false }
      - { label: "Order (1 = first)", name: order, widget: number, value_type: int, default: 50, required: false }
  - name: clients
    label: "Clients"
    folder: content/clients
    format: json
    extension: json
    create: true
    slug: "{{name_en}}"
    identifier_field: name_en
    sortable_fields: [order]
    fields:
      - { label: "Client name (English)", name: name_en, widget: string, required: false }
      - { label: "Client name (Arabic)", name: name_ar, widget: string, required: false }
      - { label: "Logo (PNG or SVG, transparent background)", name: logo, widget: image, required: false }
      - { label: "Website link (optional)", name: url, widget: string, required: false }
      - { label: "Order (1 = first)", name: order, widget: number, value_type: int, default: 50, required: false }
